spring.application.name=glassvue-backend

# --- Oracle 19c ---
# 값은 프로젝트 루트의 .env 에서 환경변수로 주입한다 (파일에 비밀값을 두지 않음)
#   set -a; source ../.env; set +a
# 서비스명은 리스너에 등록된 PDB 이름(espdb). CDB 루트(ESPCDB)로는 ESP 계정이 인증되지 않는다.
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE:espdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# 연습 단계: 엔티티 기준으로 테이블을 자동 생성/추가한다.
# 스키마가 안정되면 validate + Flyway로 옮길 것 (update는 컬럼 삭제/타입 변경을 반영하지 못한다).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Redis (로컬, 127.0.0.1:6379) ---
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

server.port=8080
