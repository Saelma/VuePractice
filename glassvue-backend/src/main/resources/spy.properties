# P6SPY 설정 — dev 프로파일에서 datasource가 jdbc:p6spy:... 일 때만 실제로 동작한다.
# (운영은 순수 oracle URL을 써서 이 파일이 classpath에 있어도 무시된다.)

# p6spy가 위임할 실제 드라이버
driverlist=oracle.jdbc.OracleDriver

# 로그는 애플리케이션 로거(SLF4J)로 — System.out 금지 규칙과 일관
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 한 줄 커스텀 포맷: [실행시간ms] category | connXX | 바인딩값이 인라인된 실제 SQL
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(category) | conn %(connectionId) | %(sqlSingleLine)

# 노이즈/민감정보 제외 — 결과셋(result/resultset)은 데이터 노출이라 로깅하지 않는다.
# 남기는 것: statement(SQL) · commit · rollback
excludecategories=info,debug,result,resultset,batch

# 커밋/롤백도 시간축에서 보이도록 남김 (위 exclude에 없음)

# 실행시간 임계값(ms) 이상만 로깅하고 싶으면 아래 주석 해제 (기본 0 = 전부)
#executionThreshold=0

# 바인딩 파라미터를 SQL에 인라인해서 보여줌 (실제 나가는 쿼리 확인)
# useprefix off / 기본값으로 sql 필드에 바인딩이 채워진다
