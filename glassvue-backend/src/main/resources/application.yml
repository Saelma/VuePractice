spring:
  application:
    name: glassvue-backend

  # --- Oracle 19c ---
  # 값은 프로젝트 루트의 .env 에서 환경변수로 주입한다 (파일에 비밀값을 두지 않음)
  #   set -a; source ../.env; set +a
  # 서비스명은 리스너에 등록된 PDB 이름(espdb). CDB 루트(ESPCDB)로는 ESP 계정이 인증되지 않는다.
  datasource:
    url: "jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE:espdb}"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  # --- 스키마 마이그레이션 (Flyway) ---
  # 기존 DB(ddl-auto=update로 만들어짐)는 baseline으로 마킹하고, 향후 스키마 변경은 V2+ 스크립트로 관리.
  # (Oracle CHECK 제약 수동 ALTER 같은 부채를 코드 버전관리로 대체)
  flyway:
    enabled: true
    baseline-on-migrate: true      # 비어있지 않은 기존 스키마를 baseline 처리(기존 테이블 안 건드림)
    baseline-version: 1
    baseline-description: "existing schema (ddl-auto managed) baseline"

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    # Flyway가 스키마를 소유. Hibernate는 엔티티↔스키마 일치만 검증(자동 변경 안 함).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # 지연로딩 연관(예: product.category)을 페이지 단위로 일괄 로딩해 N+1 완화
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # --- Redis (로컬, 127.0.0.1:6379) ---
  data:
    redis:
      host: 127.0.0.1
      port: 6379

  # 캐시는 Redis 사용
  cache:
    type: redis

  # 이미지 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

# --- JWT (시크릿은 .env의 JWT_SECRET, Base64) ---
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1209600000

# --- 비밀번호 재설정 ---
# expose-token: 재설정 요청 응답에 토큰을 실을지. 메일/SMS 발송 채널이 없는 현 단계라
#   dev 프로파일에서만 true로 켜 화면에서 링크를 바로 본다. 운영은 반드시 false —
#   true면 아이디만 알면 남의 비밀번호를 바꿀 수 있다(application-dev.yml에서만 오버라이드).
auth:
  password-reset:
    expose-token: false
    token-validity-ms: 1800000

# 조회수: Redis 누적분을 DB에 반영하는 주기(ms)
notice:
  view-count:
    flush-interval-ms: 30000

# 재고가 이 값 이하로 떨어지면 재고 부족 이벤트 발행(0=품절 포함)
catalog:
  low-stock-threshold: 5

# 고아 이미지(업로드만 하고 어디에도 안 붙은 것) 정리
image:
  cleanup-enabled: true
  cleanup-grace-hours: 24      # 업로드 후 이 시간이 지난 것만 — 작성 중인 폼의 이미지를 뺏지 않기 위한 유예
  cleanup-interval-ms: 3600000 # 1시간마다

# 업로드 파일 저장 경로 + 서빙 URL 접두사 (nginx가 /uploads/를 이 디렉토리로 서빙)
app:
  upload:
    dir: /var/www/glassvue-uploads
    url-prefix: /uploads

# 배송 조회 링크. {trackingNo}·{carrier} 자리에 값이 채워져 응답의 trackingUrl로 내려간다.
#
# ⚠ 기본값은 **앱 안의 예시 페이지**다. 실제 택배사 사이트를 가리키지 않는 이유:
#   ①주문이 전부 가짜라 송장번호도 가짜여서 실제 조회 페이지로 보내봐야 "조회 결과 없음"만 나온다
#   ②통제할 수 없는 외부 의존이 생긴다 — 택배사가 URL을 바꾸면 링크가 조용히 깨지는데 알 방법이 없다
#   (ARCHITECTURE §1 "미리 만들지 않는다")
#
# 실제 배송이 필요해지면 tracking-url 아래에 택배사별 실제 URL을 넣기만 하면 된다(코드 변경 없음).
#   tracking-url:
#     CJ: "https://실제주소?wblNo={trackingNo}"
# default-tracking-url을 빈 문자열로 두면 링크 자체를 만들지 않는다(송장번호만 표시).
glassvue:
  delivery:
    default-tracking-url: "/mock-tracking?carrier={carrier}&no={trackingNo}"

  # 배송비 정책. 주문에는 계산 결과가 스냅샷으로 저장되므로(orders.shipping_fee)
  # 여기를 바꿔도 과거 주문의 배송비는 그대로다 — 정책은 설정, 부과된 금액은 기록.
  # free-threshold: 0 이면 무료배송 없음(항상 fee 부과)
  shipping:
    fee: 3000
    free-threshold: 30000
