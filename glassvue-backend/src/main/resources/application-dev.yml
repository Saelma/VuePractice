# dev 프로파일 전용 오버라이드 (SPRING_PROFILES_ACTIVE=dev 일 때만 적용)
spring:
  # P6SPY: JDBC를 가로채 실제 SQL + 바인딩값 + 실행시간을 로깅한다.
  #   - URL 앞에 p6spy: 접두사를 붙이고 드라이버를 P6SpyDriver로 교체하는 것만으로 활성화.
  #   - 운영(기본 프로파일)은 base application.yml의 순수 oracle URL을 써서 p6spy 코드 경로를 아예 타지 않는다.
  #   - 로깅 포맷/카테고리는 classpath의 spy.properties 에서 설정.
  datasource:
    url: "jdbc:p6spy:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE:espdb}"
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  # 로컬 메일 캐처(Mailpit, 2026-07-29). **밖으로 나가지 않는다** — 받은 메일을 붙잡아
  # 웹 UI(:8025)로 보여 준다. 안 떠 있어도 재설정 흐름 자체는 계속 동작한다
  # (MailSender 가 발송 실패를 삼킨다 — 던지면 열거 방지가 깨지기 때문).
  #   실행: ~/tools/mailpit/mailpit --listen 127.0.0.1:8025 --smtp 127.0.0.1:1025
  mail:
    host: 127.0.0.1
    port: 1025

# 메일 본문 링크가 가리킬 곳. dev 는 프론트 개발 서버라 브라우저에서 바로 눌러 볼 수 있다.
glassvue:
  mail:
    base-url: http://localhost:3000

# ⚠ 메일이 붙은 뒤에도 dev 는 토큰을 응답에 계속 싣는다 — 메일 캐처를 안 띄운 상태에서도
# 재설정 흐름을 확인할 수 있어야 해서다(둘은 대체재가 아니라 이중 확인 수단).
# 운영(기본 프로파일)은 application.yml 의 false 를 그대로 써서 절대 노출하지 않는다.
auth:
  password-reset:
    expose-token: true
