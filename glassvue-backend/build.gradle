plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.glassvue'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// API 문서 (Swagger UI) — /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// 인증 (Spring Security + JWT)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 스키마 마이그레이션 (Flyway) — 기존 DB는 baseline, 향후 변경은 V2+ 스크립트로 버전관리.
	// Boot 4는 Flyway auto-config를 별도 모듈(spring-boot-flyway)로 분리 → 명시 필요.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-oracle'
	// 캐시 (Redis)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// UUIDv7 생성 (시간순 UUID)
	implementation 'com.github.f4b6a3:uuid-creator:6.0.0'
	// 이미지 리사이즈 + WebP 인코딩(파생본 썸네일/중간). scrimage-webp는 cwebp/dwebp 바이너리를 번들해
	// 런타임에 추출·실행한다(별도 시스템 설치 불필요). 원본은 그대로 보관하고 파생본만 WebP로 만든다.
	implementation 'com.sksamuel.scrimage:scrimage-core:4.3.0'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.3.0'
	// QueryDSL (동적 쿼리) — Jakarta 분류자
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	// SQL 로깅 (dev 프로파일 한정) — 실제 SQL+바인딩값+실행시간. 운영은 URL을 안 바꿔 미사용.
	runtimeOnly 'p6spy:p6spy:3.9.1'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// scrimage-webp는 JVM이 시작할 때 cwebp/dwebp 바이너리(합계 6.5MB)를 java.io.tmpdir에 추출하고
// 종료할 때 정리하지 않는다. 파일명이 JVM마다 고유해서(cwebp<난수>binary) 덮어쓰지도 않는다.
// → test/bootRun을 돌릴 때마다 /tmp에 6.5MB씩 쌓였다 (2026-07-23 실측: 11개 37MB).
//
// 운영에는 해당 없다 — systemd 유닛이 PrivateTmp=yes 라 /tmp가 격리된다(실측: private tmp 13개, 0바이트).
// /tmp도 tmpfiles.d의 `q /tmp ... 10d` 규칙으로 10일이면 지워져 무한히 늘지는 않는다.
// 그래도 개발 JVM의 임시 파일은 build/ 아래로 모아 `gradle clean`이 함께 치우게 한다 —
// 시스템 /tmp를 건드리지 않는 편이 정리 대상이 명확하다.
//
// java.io.tmpdir은 **존재하는 디렉토리**여야 하므로 실행 직전에 만든다(없으면 임시파일 생성이 실패한다).
def appTmpDir = layout.buildDirectory.dir('apptmp')

tasks.withType(Test).configureEach {
	systemProperty 'java.io.tmpdir', appTmpDir.get().asFile.absolutePath
	doFirst { appTmpDir.get().asFile.mkdirs() }
}

tasks.withType(JavaExec).configureEach {   // bootRun 포함
	systemProperty 'java.io.tmpdir', appTmpDir.get().asFile.absolutePath
	doFirst { appTmpDir.get().asFile.mkdirs() }
}
