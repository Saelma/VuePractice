plugins {
	id 'java'
	id 'jacoco'   // 테스트 커버리지 측정 (H-5, 2026-07-31) — 리포트만, 게이트 없음(아래 참조)
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.glassvue'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// 메일 발송 (2026-07-29, B-10 마무리). JavaMailSender 만 제공한다 — **보낼 서버는 설정이 정한다.**
	// spring.mail.host 가 없으면 스타터가 JavaMailSender 빈을 만들지 않고, 그때는 MailSender 가 no-op 이 된다
	// (운영 기본 프로파일이 그 상태 = 발송 꺼짐). dev 는 로컬 메일 캐처(127.0.0.1:1025)로 보낸다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// API 문서 (Swagger UI) — /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// 인증 (Spring Security + JWT)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 스키마 마이그레이션 (Flyway) — 기존 DB는 baseline, 향후 변경은 V2+ 스크립트로 버전관리.
	// Boot 4는 Flyway auto-config를 별도 모듈(spring-boot-flyway)로 분리 → 명시 필요.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-oracle'
	// 캐시 (Redis)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// UUIDv7 생성 (시간순 UUID)
	implementation 'com.github.f4b6a3:uuid-creator:6.0.0'
	// 이미지 리사이즈 + WebP 인코딩(파생본 썸네일/중간). scrimage-webp는 cwebp/dwebp 바이너리를 번들해
	// 런타임에 추출·실행한다(별도 시스템 설치 불필요). 원본은 그대로 보관하고 파생본만 WebP로 만든다.
	implementation 'com.sksamuel.scrimage:scrimage-core:4.3.0'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.3.0'
	// QueryDSL (동적 쿼리) — Jakarta 분류자
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	// SQL 로깅 (dev 프로파일 한정) — 실제 SQL+바인딩값+실행시간. 운영은 URL을 안 바꿔 미사용.
	runtimeOnly 'p6spy:p6spy:3.9.1'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()

	// ⚠ **테스트는 운영과 다른 Redis DB 를 쓴다** (2026-07-29).
	//
	// 그전엔 둘이 db0 를 공유했고, 그래서 두 방향으로 새고 있었다:
	//   ① 운영(:8080)의 조회수 플러셔가 30초마다 `notice:view:*` 를 SCAN+GETDEL 하는데,
	//      **테스트가 만든 키까지 가져갔다.** NoticeQueryServiceIntegrationTest 가 간헐적으로
	//      실패하던 진짜 원인이다 — @AfterEach 정리로는 못 막는다(지우는 게 다른 프로세스다).
	//      실측: 손으로 만든 notice:view:<uuid> 키가 20초 만에 사라졌다.
	//   ② 반대로 테스트가 운영 Redis 를 더럽혔다. 오늘 auth:reset:·auth:email-verify: 키를
	//      손으로 치운 게 그 때문이다.
	//
	// systemProperty 로 주는 이유: src/test/resources/application.yml 을 만들면 main 의 것을
	// **통째로 가린다**(datasource 설정까지 날아간다). 프로파일을 새로 파면 기본 프로파일 동작을
	// 검증하는 테스트(MailerAutoConfigOffTest)의 전제가 바뀐다. 시스템 프로퍼티는 둘 다 피한다.
	systemProperty 'spring.data.redis.database', '1'

	// 조회수 플러셔를 사실상 끈다(24시간). 위 격리로 **운영** 플러셔는 못 건드리게 됐지만,
	// 테스트 컨텍스트 자신의 @Scheduled 는 여전히 db1 을 SCAN+GETDEL 한다.
	// ⚠ fixedDelay 는 컨텍스트 기동 직후 1회 실행된다 — 그건 테스트가 키를 만들기 전이라 무해하다.
	systemProperty 'notice.view-count.flush-interval-ms', '86400000'

	// 테스트를 돌리면 커버리지 리포트도 함께 갱신한다(H-5). 수동 생성으로 두면 **어제 숫자를
	// 오늘 것으로 읽는** 사고가 난다 — 리포트는 조용히 낡는다.
	finalizedBy tasks.named('jacocoTestReport')
}

// ── 테스트 커버리지 (JaCoCo) — H-5, 2026-07-31 ────────────────────────────────
//
// ⚠ **이 도구의 사용 규약이 도구 자체보다 중요하다** (BACKLOG H-5 · WA §3):
//   · 리포트만 본다. **게이트(최소 %)는 붙이지 않는다** — 빌드를 막기 시작하면 숫자 채우기가 목적이 된다.
//   · **"커버리지 올려줘" 는 금지**. 단언 없는 테스트로도 100% 가 나온다("실행됐다"만 재고 "맞다"는 못 잰다).
//   · 쓰는 법은 하나: **"이 분기가 안 덮였는데 진짜 위험한가"** 를 찾는 자.
//     맞다고 판단되면 그 자리에 테스트를 쓰고, **변형 주입으로 그 테스트가 진짜 잡는지 확인한다**(WA §3).
//
// → 그래서 `jacocoTestCoverageVerification` 은 **일부러 설정하지 않는다.** 없는 게 아니라 안 쓴다.
jacoco {
	// 0.8.14 부터 Java 25(클래스 파일 버전 69)를 공식 지원한다. 낮추면 계측 자체가 실패한다.
	toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		html.required = true    // 사람이 읽는 것 → build/reports/jacoco/test/html/index.html
		xml.required = false    // 받아 갈 CI 가 없다. 켜면 아무도 안 읽는 파일만 생긴다
		csv.required = false
	}
	// 생성 코드는 세지 않는다 — 우리가 쓴 코드가 아니라서 숫자만 흐린다.
	//   · QueryDSL Q 클래스: annotationProcessor 산출물(수백 줄).
	//   · Lombok 생성 메서드: `lombok.config` 의 addLombokGeneratedAnnotation 으로 걸러진다(그 파일 주석 참조).
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: ['**/Q*.class'])
	}))
}

// scrimage-webp는 JVM이 시작할 때 cwebp/dwebp 바이너리(합계 6.5MB)를 java.io.tmpdir에 추출하고
// 종료할 때 정리하지 않는다. 파일명이 JVM마다 고유해서(cwebp<난수>binary) 덮어쓰지도 않는다.
// → test/bootRun을 돌릴 때마다 /tmp에 6.5MB씩 쌓였다 (2026-07-23 실측: 11개 37MB).
//
// 운영에는 해당 없다 — systemd 유닛이 PrivateTmp=yes 라 /tmp가 격리된다(실측: private tmp 13개, 0바이트).
// /tmp도 tmpfiles.d의 `q /tmp ... 10d` 규칙으로 10일이면 지워져 무한히 늘지는 않는다.
// 그래도 개발 JVM의 임시 파일은 build/ 아래로 모아 `gradle clean`이 함께 치우게 한다 —
// 시스템 /tmp를 건드리지 않는 편이 정리 대상이 명확하다.
//
// java.io.tmpdir은 **존재하는 디렉토리**여야 하므로 실행 직전에 만든다(없으면 임시파일 생성이 실패한다).
def appTmpDir = layout.buildDirectory.dir('apptmp')

tasks.withType(Test).configureEach {
	systemProperty 'java.io.tmpdir', appTmpDir.get().asFile.absolutePath
	doFirst { appTmpDir.get().asFile.mkdirs() }
}

tasks.withType(JavaExec).configureEach {   // bootRun 포함
	systemProperty 'java.io.tmpdir', appTmpDir.get().asFile.absolutePath
	doFirst { appTmpDir.get().asFile.mkdirs() }
}
