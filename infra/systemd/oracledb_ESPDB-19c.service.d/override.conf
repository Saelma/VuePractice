# Oracle SysV 스크립트(/etc/init.d/oracledb_ESPDB-19c)의 부팅 실패를 보정하는 drop-in.
# 원본 스크립트는 설치 프로그램이 만든 것이라 건드리지 않고, 여기서만 덮는다.
#
# 1) SELinux (= 진짜 원인, 2026-07-23 확인)
#    부팅 시 이 스크립트는 init_t 컨텍스트로 도는데, SELinux가 init_t → su_exec_t(/bin/su)
#    실행을 거부한다:
#      avc: denied { execute } for comm="oracledb_ESPDB-" name="su"
#           scontext=system_u:system_r:init_t:s0 tcontext=system_u:object_r:su_exec_t:s0
#    스크립트는 리스너와 DB를 둘 다 `su`로 띄우므로 둘 다 즉시 실패(exit=-13)한다.
#    Oracle 자체가 아예 실행되지 않아 TNS/ORA 에러조차 남지 않고, 스크립트는 출력을
#    /dev/null 로 버려서 "Failed to start ..." 한 줄만 보인다 — 원인 추적이 매우 어렵다.
#    셸에서 수동 실행하면 unconfined_t 라 항상 성공해서, "수동은 되는데 부팅만 실패"로 보인다.
#
#    → 스크립트 47행의 `if [ -z "$SU" ]; then SU=/bin/su; fi` 훅을 이용해 runuser 로 바꾼다.
#      runuser 는 util-linux 가 init 스크립트용으로 제공하는 su 대체품이고(-s/-c 동일),
#      라벨이 bin_t 라 init_t 가 실행할 수 있다.
#
# 2) 네트워크 순서
#    sysv-generator 가 만든 유닛엔 네트워크 의존성이 없어 부팅 13초 만에 실행된다.
#    이 장애의 원인은 아니었지만(원인은 1번), 순서상 맞는 설정이라 유지한다.

[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Environment=SU=/usr/sbin/runuser
