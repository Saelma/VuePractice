upstream glassvue_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- HTTP(:80) → HTTPS(:443) 리다이렉트 ---
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    return 301 https://$host$request_uri;
}

# --- HTTPS(:443) TLS 종단. 백엔드는 내부 HTTP(:8080) 유지 ---
server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    http2 on;
    server_name  _;

    # self-signed 인증서 (내부 VM용). 공인 도메인 생기면 Let's Encrypt로 교체.
    ssl_certificate     /etc/nginx/ssl/glassvue.crt;
    ssl_certificate_key /etc/nginx/ssl/glassvue.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # --- 보안 헤더 (IP 접속에서도 유효). HSTS는 IP엔 무효라 도메인 도입 시점에 추가. ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    root  /var/www/glassvue-frontend;
    index index.html;

    access_log /var/log/nginx/glassvue-access.log;
    error_log  /var/log/nginx/glassvue-error.log;

    # 업로드 여유
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- 백엔드 API ---
    location /api/ {
        proxy_pass http://glassvue_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # https (TLS 종단 정보 전달)
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- 헬스체크 (운영 노출 최소화: 로컬만 허용) ---
    location /actuator/health {
        proxy_pass http://glassvue_backend;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
    }

    # --- 업로드 이미지 서빙 ---
    # location에 add_header가 있으면 server 레벨 add_header는 무시된다 → 보안 헤더를 여기서 다시 선언.
    # 특히 nosniff는 업로드 파일이 HTML 등으로 스니핑되는 걸 막아 실익이 크다.
    location /uploads/ {
        alias /var/www/glassvue-uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- 정적 자산: 해시 파일명이라 장기 캐시 ---
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- SPA 진입점(index.html): 캐시하지 않는다 ---
    # index.html이 캐시되면 배포 후에도 브라우저가 옛 해시 번들을 계속 참조해 새 기능이 안 보인다
    # (2026-07-21 이미지 파생본 배포 때 실제로 이걸로 오진함). no-cache = 저장은 하되 매번 재검증(변경 없으면 304).
    # 해시 파일명인 /static/ 자산은 그대로 장기 캐시 — 내용이 바뀌면 파일명이 바뀌므로 안전하다.
    # location에 add_header가 있으면 server 레벨이 무시되므로 보안 헤더도 여기서 다시 선언한다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # --- SPA 라우팅: 없는 경로는 index.html 로 ---
    # try_files 폴백은 내부 리다이렉트라 위 `location = /index.html` 규칙을 그대로 탄다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
